<div class="wp-content">
	<div class="wp-wrap">
		<!--
			What post-new.php prints for this post type once the demo has taken
			the screen: WordPress's own heading and #poststuff are hidden
			(demo/ui/theme/demo.css, keyed on body.bfields-demo-editor) and the
			demo bundle draws the whole editor to the design — title, shortcode
			bar, tabs, sidebar — into ONE root, which Metabox::render() prints
			inside #post. This is that root, minus the nonce and the hidden
			mirror field: there is no form to post, and every submit button
			says so rather than pretending.
		-->
		<div id="bfields-static-viewer"
			class="bfields-demo-root bfields-app"
			data-unique="_bfields_demo_viewer_"
			data-kind="metabox"></div>
	</div>
</div>
