<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>3D Viewer Settings — bfields static preview</title>

	<!-- The framework's real compiled stylesheet, then the demo's, in the order
	     the plugin enqueues them. Order is load-bearing: the demo sheet
	     overrides framework rules and would lose if it came first. -->
	<link rel="stylesheet" href="../../build/index.css">
	<link rel="stylesheet" href="../build/index.css">
	<link rel="stylesheet" href="assets/wp-admin.css">
</head>

<body class="wp-admin">

<div class="wp-adminbar">
	<a href="index.html">⌂ dev.local</a>
	<span class="wp-adminbar__spacer"></span>
	<span class="wp-adminbar__note">static preview — nothing is saved</span>
</div>

<nav class="wp-adminmenu">
	<ul>
		<li><a href="#"><span class="wp-adminmenu__glyph">▤</span> Dashboard</a></li>
		<li><a href="#"><span class="wp-adminmenu__glyph">✎</span> Posts</a></li>
		<li><a href="#"><span class="wp-adminmenu__glyph">▣</span> Media</a></li>
		<li><a href="#"><span class="wp-adminmenu__glyph">⎘</span> Pages</a></li>
		<li class="wp-adminmenu__separator"></li>
		<li class="is-current">
			<a href="index.html"><span class="wp-adminmenu__glyph">◱</span> 3D Viewer Demo</a>
			<ul class="wp-submenu">
				<li><a href="index.html">All 3D Viewers</a></li>
				<li class="is-nested"><a href="add-new.html">Add New</a></li>
				<li class="is-current"><a href="settings.html">Settings</a></li>
			</ul>
		</li>
		<li class="wp-adminmenu__separator"></li>
		<li><a href="#"><span class="wp-adminmenu__glyph">⚙</span> Settings</a></li>
	</ul>
</nav>

<div class="wp-content">
	<!--
		An options screen renders ONE empty div and nothing else — no .wrap, no
		<h1>, no form. Everything from the page title down is the React body's,
		which is why the screen can be full-bleed. This markup is exactly what
		BFields\OptionsPage::render() prints, brand tokens included.
	-->
	<div id="bfields-static-settings"
		class="bfields-root bfields-app"
		data-unique="_bfields_demo_settings_"
		data-kind="options"></div>
</div>

<script src="assets/icons.js"></script>
<script src="assets/schema.js"></script>
<script src="assets/preview.js"></script>
</body>
</html>
